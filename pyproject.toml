[project]
name = "bosch-ble"
version = "0.1.0"
description = "CLI tools for inspecting and interacting with Bosch smart-system eBike BLE devices"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.0.1",
    "bleak-esphome>=3.9.7",
    "dbus-fast>=1.83.0",
    "habluetooth>=3.0.0",
    "textual>=8.2.3",
]

[dependency-groups]
dev = [
 "pytest>=9.0.3",
 "ruff>=0.15.11",
 "ty>=0.0.31",
]

[project.scripts]
bosch-ble-bluez-connect = "bosch_ble.bluez:connect_cli"
bosch-ble-bluez-diagnose-pair = "bosch_ble.bluez:diagnose_pair_cli"
bosch-ble-bluez-info = "bosch_ble.bluez:info_cli"
bosch-ble-bluez-preflight = "bosch_ble.bluez:preflight_cli"
bosch-ble-bluez-wait-services = "bosch_ble.bluez:wait_services_cli"
bosch-ble-dashboard = "bosch_ble.dashboard:cli"
bosch-ble-dump-gatt = "bosch_ble.dump_gatt:cli"
bosch-ble-handshake = "bosch_ble.handshake:cli"
bosch-ble-log-chars = "bosch_ble.log_chars:cli"
bosch-ble-probe = "bosch_ble.probe:cli"
bosch-ble-scan = "bosch_ble.scan:cli"
bosch-ble-validate-live = "bosch_ble.validate_live:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E1", "E4", "E7", "E9", "F"]

[tool.ty]
