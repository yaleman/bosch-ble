name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check bosch_ble tests

      - name: Ty
        run: uv run ty check

      - name: Pytest
        run: uv run pytest -q
